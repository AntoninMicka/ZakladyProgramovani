<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1110" viewBox="0 0 1100 1110" role="img" aria-labelledby="title desc">
<title id="title">Zapojení ECU simulátoru: Arduino Mega a Wokwi Custom Chip</title>
<desc id="desc">Python komunikuje s UART0 MCU přes RFC2217. UART1 propojuje MCU s chipem. Chip generuje CKP, CMP a analogové snímače a zachycuje čtyři vstřikovače a čtyři cívky. Analyzátor sleduje CKP, CMP, INJ0 a COIL0.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#0f172a}.title{font-size:25px;font-weight:bold}.label{font-size:16px;font-weight:bold}.small{font-size:14px}.pin{font-size:15px;font-family:DejaVu Sans Mono,monospace}.muted{fill:#475569}</style>
