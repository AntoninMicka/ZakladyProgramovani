<rect x="40" y="866" width="1020" height="112" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
<text x="60" y="896" class="label">Logic Analyzer · pozorování skutečných virtuálních pinů</text>
<text x="60" y="924" class="pin">D0 ← CKP    D1 ← CMP    D2 ← Mega D22 / INJ0    D3 ← Mega D26 / COIL0</text>
<text x="60" y="952" class="small">GND → společná zem · export VCD → tools/check_vcd.py</text>
<text x="40" y="1015" class="small muted">Šipka ukazuje směr signálu. INJ/COIL jsou logické výstupy MCU sledované chipem.</text>
<text x="40" y="1044" class="small muted">Jde o virtuální zapojení Wokwi; výkonové budiče skutečných vstřikovačů a cívek zde nejsou.</text>
<text x="40" y="1073" class="small muted">RFC2217 nesynchronizuje hodiny Pythonu a Wokwi. Přesnost pinů čeká na integrační ověření.</text>
