[platformio]
default_envs = esp32
src_dir = firmware/src
include_dir = firmware/include

[env:esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

[env:mega]
platform = atmelavr@5.1.0
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra
