<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">ECU - snímače, vstupy, procesor a výkonové výstupy</title>
<desc id="desc">Blokové schéma automobilové ECU se snímači, MOSFET a IGBT drivery. Wokwi simuluje logické povely a aktivitu, nikoli vysoké proudy či jiskru.</desc>
<rect width="1400" height="1000" fill="#0f172a"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#e2e8f0">
<text x="35" y="42" font-size="26" fill="#e2e8f0">ECU / čtyřtaktní motor · esp32</text>
<rect x="35" y="70" width="245" height="95" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
<text x="50" y="98" font-size="18" fill="#f87171">Baterie auta · 12 V</text>
<text x="50" y="125" font-size="16" fill="#e2e8f0">Pojistka + ochrana napájení</text>
<path d="M280 115 L350 115" stroke="#f87171" stroke-width="3" fill="none"/>
<rect x="350" y="70" width="280" height="95" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
<text x="365" y="98" font-size="18" fill="#f87171">Hlavní relé / svorka 15</text>
<text x="365" y="125" font-size="16" fill="#e2e8f0">Ve Wokwi přepínač POWER_EN</text>
<path d="M630 115 L730 115" stroke="#f87171" stroke-width="3" fill="none"/>
<rect x="730" y="70" width="270" height="95" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
<text x="745" y="98" font-size="18" fill="#f87171">Napájení zátěží · 12 V</text>
<rect x="1050" y="70" width="315" height="95" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
<text x="1065" y="98" font-size="18" fill="#f87171">Regulátory ECU</text>
<text x="1065" y="125" font-size="16" fill="#e2e8f0">5 V snímače / 3,3 V MCU (ESP32)</text>
<path d="M1000 115 L1050 115" stroke="#f87171" stroke-width="3" fill="none"/>
<rect x="35" y="215" width="340" height="440" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
<text x="50" y="243" font-size="18" fill="#38bdf8">MOTOR / SNÍMAČE</text>
<rect x="425" y="215" width="330" height="440" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
<text x="440" y="243" font-size="18" fill="#a78bfa">ECU: vstupy + procesor</text>
<rect x="825" y="215" width="540" height="440" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
<text x="840" y="243" font-size="18" fill="#4ade80">ECU: drivery → skutečné zátěže</text>
<text x="50" y="285" font-size="16" fill="#e2e8f0">CKP · poloha kliky · 60-2</text>
<path d="M375 280 L425 280" stroke="#38bdf8" stroke-width="3" fill="none"/>
<text x="50" y="338" font-size="16" fill="#e2e8f0">CMP · poloha vačky · cyklus 720°</text>
<path d="M375 333 L425 333" stroke="#38bdf8" stroke-width="3" fill="none"/>
<text x="50" y="391" font-size="16" fill="#e2e8f0">MAP · tlak v sání</text>
<path d="M375 386 L425 386" stroke="#38bdf8" stroke-width="3" fill="none"/>
<text x="50" y="444" font-size="16" fill="#e2e8f0">TPS · poloha škrticí klapky</text>
<path d="M375 439 L425 439" stroke="#38bdf8" stroke-width="3" fill="none"/>
<text x="50" y="497" font-size="16" fill="#e2e8f0">IAT / CLT · teplotní snímače</text>
<path d="M375 492 L425 492" stroke="#38bdf8" stroke-width="3" fill="none"/>
<text x="50" y="550" font-size="16" fill="#e2e8f0">Lambda · výstup jejího řadiče</text>
<path d="M375 545 L425 545" stroke="#38bdf8" stroke-width="3" fill="none"/>
<text x="440" y="285" font-size="16" fill="#e2e8f0">CKP/CMP: vstup po tvarování</text>
<text x="440" y="338" font-size="16" fill="#e2e8f0">Analog: přizpůsobení rozsahu ADC</text>
<text x="440" y="391" font-size="16" fill="#e2e8f0">MCU čte polohu a počítá termíny</text>
<text x="440" y="444" font-size="16" fill="#e2e8f0">GPIO vysílá řídicí povely</text>
<text x="440" y="497" font-size="16" fill="#e2e8f0">MCU nenapájí cívky ani vstřiky</text>
<text x="440" y="550" font-size="16" fill="#e2e8f0">SGND: zem snímačů</text>
<path d="M755 280 L840 280" stroke="#4ade80" stroke-width="3" fill="none"/>
<text x="850" y="285" font-size="16" fill="#4ade80">INJ1: MOSFET → vstřikovač → +12 V</text>
<text x="850" y="312" font-size="16" fill="#facc15">IGN1: IGBT / chytrá cívka → svíčka</text>
<path d="M755 363 L840 363" stroke="#4ade80" stroke-width="3" fill="none"/>
<text x="850" y="368" font-size="16" fill="#4ade80">INJ2: MOSFET → vstřikovač → +12 V</text>
<text x="850" y="395" font-size="16" fill="#facc15">IGN2: IGBT / chytrá cívka → svíčka</text>
<path d="M755 446 L840 446" stroke="#4ade80" stroke-width="3" fill="none"/>
<text x="850" y="451" font-size="16" fill="#4ade80">INJ3: MOSFET → vstřikovač → +12 V</text>
<text x="850" y="478" font-size="16" fill="#facc15">IGN3: IGBT / chytrá cívka → svíčka</text>
<path d="M755 529 L840 529" stroke="#4ade80" stroke-width="3" fill="none"/>
<text x="850" y="534" font-size="16" fill="#4ade80">INJ4: MOSFET → vstřikovač → +12 V</text>
<text x="850" y="561" font-size="16" fill="#facc15">IGN4: IGBT / chytrá cívka → svíčka</text>
<text x="840" y="620" font-size="14" fill="#e2e8f0">PGND · omezení indukčních špiček · logická indikace LED</text>
<rect x="35" y="695" width="650" height="115" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
<text x="50" y="723" font-size="18" fill="#38bdf8">SIMULAČNÍ ROZHRANÍ</text>
<text x="50" y="748" font-size="16" fill="#e2e8f0">Python ↔ RFC2217 / UART ↔ Engine Interface Custom Chip</text>
<text x="50" y="779" font-size="16" fill="#e2e8f0">Budí snímače; měří aktivitu zátěží až ZA modelem driverů.</text>
<rect x="730" y="695" width="635" height="115" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
<text x="745" y="723" font-size="18" fill="#a78bfa">LOGIC ANALYZER / VCD</text>
<text x="745" y="748" font-size="16" fill="#e2e8f0">D0 CKP · D1 CMP · D2 INJ1 LOAD · D3 IGN1 LOAD</text>
<text x="745" y="779" font-size="16" fill="#e2e8f0">D4 INJ1 CTRL · D5 IGN1 CTRL · D6 POWER_EN</text>
<text x="35" y="860" font-size="16" fill="#fbbf24">Červený horní řetězec popisuje skutečnou funkci auta; Wokwi používá logické napájecí úrovně.</text>
<text x="35" y="895" font-size="16" fill="#e2e8f0">Vstupní blok už dostává signály v rozsahu MCU. Nepočítá analogovou elektroniku VR / NTC / lambda.</text>
<text x="35" y="930" font-size="16" fill="#e2e8f0">Výstupní blok počítá povel AND POWER_EN. Nepočítá proud, magnetické pole, přepětí ani vysoké napětí svíčky.</text>
</g></svg>
