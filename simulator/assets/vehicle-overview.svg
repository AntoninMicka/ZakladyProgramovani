<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" font-family="DejaVu Sans, sans-serif">
  <title>Schéma celého vozu – přední pohon, CAN, TCU, ABS/ESP</title>
  <desc>Interaktivní výukový půdorys. Příď je nahoře, levá strana vozu vlevo. Mechanický pohon modře, komunikace CAN fialově čárkovaně.</desc>
  <text x="35" y="42" fill="#334155" font-size="30" font-weight="bold">CELÝ VŮZ · PŘEDNÍ POHON</text>
  <text x="35" y="74" fill="#334155" font-size="19">Příď ↑ · FL/FR přední, RL/RR zadní · klikni na součást pro živé hodnoty</text>
