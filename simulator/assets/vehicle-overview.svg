  <text x="1070" y="260" fill="#334155" font-size="17" data-part="can">Komunikace řídicích jednotek</text>
  <text x="1070" y="290" fill="#334155" font-size="17" data-part="can">Snímače → CAN → TCU / ESP</text>
  <text x="1070" y="320" fill="#334155" font-size="17" data-part="dashboard">CAN → palubní přístroje</text>
  <text x="1070" y="615" fill="#334155" font-size="19" font-weight="bold">Barvy kol:</text>
  <text x="1070" y="650" fill="#0f766e" font-size="18">Tyrkysová: běžný stav</text>
  <text x="1070" y="680" fill="#dc2626" font-size="18">Červená: brzdění</text>
  <text x="1070" y="710" fill="#b45309" font-size="18">Oranžová: skluz</text>
  <text x="35" y="895" fill="#334155" font-size="19">Modrá silná: mechanický přenos momentu · Fialová čárkovaná: komunikace CAN</text>
  <text x="35" y="925" fill="#334155" font-size="17">Výukové rozmístění součástí, nikoli konstrukční výkres. Živé hodnoty pocházejí z aktivního modelu.</text>
